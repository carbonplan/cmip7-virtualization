[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmip7_virtualization"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "cmip7-virtualization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bokeh",
    "dask",
    "distributed",
    "h5netcdf",
    "h5py",
    "icechunk>=2.0",
    "ipykernel",
    "netcdf4",
    "pre-commit",
    "virtualizarr @ git+https://github.com/zarr-developers/VirtualiZarr",
    "fastparquet",
    "s3fs",
    "xarray",
    "kerchunk",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.7",
    "httpx>=0.28.1",
    "onepassword-sdk>=0.4.0",
    "pystac>=1.10",
    "xpystac",
    "obspec-utils>=0.9.0",
]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
docs = [
    "mystmd",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a live remote catalog or store over the network (deselect with -m 'not live')",
    "watch: asserts an observed catalog state still holds; a failure means the catalogs changed, not that our code broke (deselect with -m 'not watch')",
]
